method: umbrella_sampling
random_seed: 7
runtime:
  potential:
    provider: reax
    backend: xreac
    parameters:
      model: bundled:ffield.reax.PtNiCHO.2016
  executor:
    provider: ase
    method: md
    parameters:
      setup:
        ensemble: nvt
        timestep: 0.25
        regulator:
          name: berendsen
          targets:
            temperature: 300.0
          parameters:
            Tdamp: 100.0
      output:
        trajectory:
          period: 5
      stop:
        steps: 20
  dispatch:
    worker: single
system:
  builder:
    method: read_stru
    fname: examples/compute/assets/ni111_water.xyz
  collective_variable:
    method: distance
    group: "`index 8 10`"
strategy:
  centers: [0.95, 1.15, 1.35, 1.55]
  kspring: 5.0
  replicas: 2
  equilibration_steps: 10
