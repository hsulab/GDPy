parameters:
  initial_dataset: ./dataset
  initial_structure: ./cu3au1.xyz
  force_deviation_min: 0.001

resources:
  seed_data:
    __type__: dataset
    options:
      name: xyz
      dataset_path: {$param: initial_dataset}
      train_ratio: 1.0
      batchsize: 4
      random_seed: 1112

  training_potential:
    __type__: potential
    options:
      provider: deepmd
      backend: ase
      parameters:
        type_list: [Cu, Au]
        estimate_uncertainty: true

  dpa4c_trainer:
    __type__: trainer
    options:
      provider: deepmd
      parameters:
        config: {$file: dpa4c.json}
        train_epochs: 10
        print_epochs: 1
        train_batches: null
        random_seed: 1112
