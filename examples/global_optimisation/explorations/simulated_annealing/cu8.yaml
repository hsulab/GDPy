method: global_optimisation
random_seed: 7
system:
  periodic: true
  preserve_fragments: false
  retained_size: 2
  initial:
    total_size: 2
    builder_allocations:
      - builder: random
        size: 2
  generation:
    total_size: 4
  builders:
    random:
      method: read_stru
      fname: examples/global_optimisation/assets/cu8_seeds.xyz
strategy:
  method: simulated_annealing
  annealing:
    start_temperature: 1200.0
    final_temperature: 300.0
    schedule: linear
  convergence:
    generation: 3
  minimisation:
    stop:
      steps: 1000
      fmax: 0.05
