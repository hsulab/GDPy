method: global_optimisation
random_seed: 7
system:
  periodic: true
  preserve_fragments: false
  retained_size: 2
  initial:
    total_size: 2
    builder_allocations:
    - builder: init
      size: 2
  generation:
    total_size: 4
  builders:
    init:
      method: read_stru
      fname: ../../assets/cu8_seeds.xyz
strategy:
  method: simulated_annealing
  convergence:
    generation: 3
  temperatures:
  - [1200, 300]
  - [900, 200]
  - [600, 100]
  minimisation:
    runtime:
      executor:
        provider: ase
        method: min
        parameters:
          stop:
            steps: 1000
            fmax: 0.05
