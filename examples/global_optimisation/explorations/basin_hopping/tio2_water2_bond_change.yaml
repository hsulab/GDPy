method: global_optimisation
random_seed: 41
system:
  periodic: true
  retained_size: 2
  reference_builder: seeds
  builders:
    seeds:
      method: direct
      frames: ./examples/global_optimisation/assets/tio2_water2_bond_seeds.xyz
      indices: [0, 1]
  initial:
    total_size: 2
    builder_allocations:
      - builder: seeds
        size: 2
  generation:
    total_size: 2
  comparator:
    method: atoms
strategy:
  method: basin_hopping
  convergence:
    generation: 1
  steps_per_chain: 4
  selection:
    replace: false
  operators:
    - method: rotate
      particles: [H2O, HO]
      center: O
      max_angle: 75.0
      temperature: 500.0
      covalent_ratio: [0.7, 2.0]
      allow_isolated: true
      probability: 0.5
    - method: bond_change
      pairs: [[O, H]]
      mode: both
      form_distance: 1.0
      break_distance: 1.5
      max_pair_distance: 3.5
      bond_cutoffs:
        O-H: 1.25
        Ti-H: 1.25
      break_fragments: [H2O, H]
      form_fragments: [[HO, H], [substrate, H]]
      temperature: 500.0
      covalent_ratio: [0.7, 2.0]
      allow_isolated: true
      max_random_attempts: 100
      probability: 0.5
