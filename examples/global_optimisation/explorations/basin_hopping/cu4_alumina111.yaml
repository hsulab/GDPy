method: global_optimisation
random_seed: 53
system:
  comparator:
    method: interatomic_distance
  builders:
    random:
      method: random_structure_improved
      substrates: ./examples/global_optimisation/assets/alpha_alumina111_ortho.xyz
      composition:
        Cu: 4
      region:
        method: sphere
        origin: [7.1385, 8.2428, 10.0]
        radius: 1.8
      covalent_ratio: [0.6, 2.0]
  initial:
    total_size: 4
    builder_allocations:
      - builder: random
        size: 4
  generation:
    total_size: 2
strategy:
  method: basin_hopping
  operators:
    - method: move
      particles: [Cu]
      temperature: 500.0
      max_disp: 0.8
      covalent_ratio: [0.6, 2.0]
      max_random_attempts: 100
      probability: 1.0
  steps_per_chain: 8
