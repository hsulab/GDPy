method: global_optimisation
random_seed: 7
population:
  comparator:
    method: interatomic_distance
  builders:
    random:
      method: random_structure_improved
      composition:
        Cu: 6
        Ni: 1:3
      box: [20.0, 20.0, 20.0]
      region:
        method: sphere
        origin: [10.0, 10.0, 10.0]
        radius: 3.0
      covalent_ratio: [0.7, 2.0]
  initial:
    total_size: 4
    builder_allocations:
      - {builder: random, size: 4}
  generation:
    total_size: 2
objective:
  target: formation_energy
  chemical_potentials:
    Cu: 0.0
    Ni: -0.5
convergence:
  generation: 1
strategy:
  method: basin_hopping
  operators:
    - method: exchange
      particles: [Ni]
      chempots: [-0.5]
      temperature: 1000.0
      region:
        method: sphere
        origin: [10.0, 10.0, 10.0]
        radius: 3.0
      covalent_ratio: [0.7, 2.0]
      max_random_attempts: 100
      probability: 0.7
    - method: move
      particles: [Cu, Ni]
      temperature: 1000.0
      max_disp: 0.8
      covalent_ratio: [0.7, 2.0]
      max_random_attempts: 100
      probability: 0.3
  steps_per_chain: 8
