method: global_optimisation
random_seed: 41
system:
  periodic: true
  retained_size: 2
  reference_builder: seeds
  builders:
    seeds:
      method: direct
      frames: ./examples/global_optimisation/assets/tio2_water2_seeds.xyz
      indices: [0, 1]
  initial:
    total_size: 2
    builder_allocations:
      - builder: seeds
        size: 2
  generation:
    total_size: 2
  comparator:
    method: atoms
strategy:
  method: basin_hopping
  convergence:
    generation: 1
  steps_per_chain: 4
  selection:
    replace: false
  operators:
    - method: rotate
      particles: [H2O]
      center: O
      max_angle: 75.0
      temperature: 500.0
      covalent_ratio: [0.7, 2.0]
      allow_isolated: true
      max_random_attempts: 100
      probability: 1.0
