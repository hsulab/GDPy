method: global_optimisation
random_seed: 67
population:
  comparator:
    method: interatomic_distance
  builders:
    random:
      method: random_structure_improved
      substrates: ./examples/global_optimisation/assets/alpha_alumina111_ortho.xyz
      composition:
        Cu: 4
        CO: 1
      region:
        method: sphere
        origin: [7.1385, 8.2428, 10.2]
        radius: 2.4
      covalent_ratio: [0.6, 2.0]
    site_insertion:
      method: adsorbate_insertion
      substrates: ./examples/global_optimisation/assets/cu4_alumina111_supported.xyz
      composition:
        CO: 1
      sites:
        group: '`symbol Cu`'
        cutoff: 3.0
        max_order: 1
        surf_index: 2
      covalent_ratio: [0.6, 2.0]
  initial:
    total_size: 8
    builder_allocations:
      - builder: random
        size: 4
      - builder: site_insertion
        size: 4
  generation:
    total_size: 2
convergence:
  generation: 1
strategy:
  method: genetic_algorithm
  operators:
    crossover:
      method: cut_and_splice
    mutation:
      method: rattle
  reproduction:
    size: 2
    mutation_probability: 0.5
  mutation:
    size: 0
  completion:
    builder_proportions:
      - builder: random
        proportion: 1.0
