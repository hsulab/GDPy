method: global_optimisation
random_seed: 17
system:
  comparator:
    method: interatomic_distance
  builders:
    random:
      method: random_structure_improved
      composition:
        H2O: 4
      box: [20.0, 20.0, 20.0]
      region:
        method: sphere
        origin: [10.0, 10.0, 10.0]
        radius: 3.0
      molecular_distances: [1.5, 5.0]
      covalent_ratio: [0.7, 2.0]
  initial:
    total_size: 4
    builder_allocations:
      - builder: random
        size: 4
  generation:
    total_size: 2
strategy:
  method: genetic_algorithm
  convergence:
    generation: 1
  operators:
    crossover:
      method: cut_and_splice
    mutation:
      method: rattle
  reproduction:
    size: 2
    mutation_probability: 1.0
  mutation:
    size: 0
  completion:
    builder_proportions:
      - builder: random
        proportion: 1.0
