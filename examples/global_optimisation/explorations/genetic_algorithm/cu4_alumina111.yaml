method: genetic_algorithm
recipe:
  random_seed: 53
  population:
    comparator:
      method: interatomic_distance
    builders:
      random:
        method: random_structure_improved
        substrates: ./examples/global_optimisation/assets/alpha_alumina111_ortho.xyz
        composition:
          Cu: 4
        region:
          method: sphere
          origin: [7.1385, 8.2428, 10.0]
          radius: 1.8
        covalent_ratio: [0.6, 2.0]
    initial:
      total_size: 4
      builder_allocations:
        - builder: random
          size: 4
    generation:
      total_size: 2
      reproduction:
        size: 2
        mutation_probability: 0.5
      mutation:
        size: 0
      completion:
        builder_proportions:
          - builder: random
            proportion: 1.0
  operators:
    crossover:
      method: periodic_cut_and_splice
    mutation:
      method: rattle
  convergence:
    generation: 1
