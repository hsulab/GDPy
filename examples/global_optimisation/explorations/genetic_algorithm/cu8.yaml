method: global_optimisation
random_seed: 7
population:
  comparator:
    method: interatomic_distance
  builders:
    random:
      method: random_structure_improved
      composition:
        Cu: 8
      box: [20.0, 20.0, 20.0]
      region:
        method: sphere
        origin: [10.0, 10.0, 10.0]
        radius: 3.0
      covalent_ratio: [0.6, 2.0]
  initial:
    total_size: 4
    builder_allocations:
      - builder: random
        size: 4
  generation:
    total_size: 2
convergence:
  generation: 1
strategy:
  method: genetic_algorithm
  operators:
    crossover:
      method: cut_and_splice
    mutation:
      method: rattle
  reproduction:
    size: 2
    mutation_probability: 0.5
  mutation:
    size: 0
  completion:
    builder_proportions:
      - builder: random
        proportion: 1.0
