method: genetic_algorithm
recipe:
  random_seed: 79
  population:
    periodic: true
    comparator:
      method: interatomic_distance
    builders:
      adsorbate:
        method: adsorbate_insertion
        substrates: ./examples/global_optimisation/assets/cu4_alumina111_supported.xyz
        composition:
          CO: 1
        sites:
          group: "`symbol Cu`"
          cutoff: 3.0
          max_order: 1
          surf_index: 2
        covalent_ratio: [0.6, 2.0]
    reference_builder: adsorbate
    initial:
      total_size: 4
      builder_allocations:
        - builder: adsorbate
          size: 4
    generation:
      total_size: 2
      reproduction:
        size: 2
        mutation_probability: 0.5
      mutation:
        size: 0
      completion:
        builder_proportions:
          - builder: adsorbate
            proportion: 1.0
  operators:
    crossover:
      method: periodic_cut_and_splice
    mutation:
      method: rattle
  convergence:
    generation: 1

runtime:
  potential:
    provider: mattersim
    parameters:
      model: MatterSim-v1.0.0-1M
      compute_stress: false
  executor:
    provider: ase
    method: min
    parameters:
      fmax: 0.05
      steps: 100
      constraint: lowest 60
