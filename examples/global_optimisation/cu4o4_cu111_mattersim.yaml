method: genetic_algorithm
recipe:
  random_seed: 41
  population:
    comparator:
      method: interatomic_distance
    retained_size: 2
    builders:
      random:
        method: random_structure_improved
        substrates: ./examples/global_optimisation/assets/cu111_p2x2_2layer.xyz
        composition:
          Cu: 4
          O: 4
        region:
          method: lattice
          origin: [0.0, 0.0, 4.6]
          cell:
            - [5.11238203, 0.0, 0.0]
            - [0.0, 4.42745271, 0.0]
            - [0.0, 0.0, 4.5]
        covalent_ratio: [0.6, 2.0]
    initial:
      total_size: 4
      builder_allocations:
        - builder: random
          size: 4
    generation:
      total_size: 2
      reproduction:
        size: 2
        mutation_probability: 0.5
      mutation:
        size: 0
      completion:
        builder_proportions:
          - builder: random
            proportion: 1.0
  operators:
    crossover:
      method: periodic_cut_and_splice
    mutation:
      method: rattle
  convergence:
    generation: 1

runtime:
  potential:
    provider: mattersim
    parameters:
      model: MatterSim-v1.0.0-1M
      compute_stress: false
  executor:
    provider: ase
    method: min
    parameters:
      fmax: 0.05
      steps: 100
      constraint: lowest 4
