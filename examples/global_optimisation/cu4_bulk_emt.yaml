method: genetic_algorithm
recipe:
  random_seed: 29
  database: cu4-bulk.db
  population:
    builders:
      random:
        method: random_bulk
        composition:
          Cu: 4
        box:
          volume: 48.0
          bounds:
            phi: [60.0, 120.0]
            chi: [60.0, 120.0]
            psi: [60.0, 120.0]
            a: [3.0, 6.0]
            b: [3.0, 6.0]
            c: [3.0, 6.0]
        covalent_ratio: [0.7, 2.0]
    initial:
      total_size: 4
      builder_allocations:
        - builder: random
          size: 4
    generation:
      total_size: 2
      reproduction:
        size: 2
        mutation_probability: 0.5
      mutation:
        size: 0
      completion:
        builder_proportions:
          - builder: random
            proportion: 1.0
  operators:
    comparator:
      method: interatomic_distance
    crossover:
      method: periodic_cut_and_splice
    mutation:
      - method: rattle
        probability: 1.0
      - method: strain
        probability: 0.5
        stddev: 0.15
  property:
    target: energy
  convergence:
    generation: 1

runtime:
  schema_version: 2
  potential:
    provider: emt
    parameters: {}
  executor:
    provider: ase
    method: min
    parameters:
      fmax: 0.05
      steps: 100

scheduler:
  provider: local
  parameters: {}
