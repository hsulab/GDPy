method: genetic_algorithm
recipe:
  random_seed: 7
  database: cu13.db
  population:
    random_generator:
      method: random_structure_improved
      composition:
        Cu: 13
      box: [10.0, 10.0, 10.0]
      region:
        method: sphere
        origin: [5.0, 5.0, 5.0]
        radius: 3.0
      pbc: false
      covalent_ratio: [0.6, 2.0]
    initial:
      size: 4
    generation:
      size: 2
      reproduction: 2
    reproduction:
      mutation_probability: 0.5
  operators:
    comparator:
      method: interatomic_distance
    crossover:
      method: cut_and_splice_cluster
    mutation:
      method: rattle
      probability: 1.0
  property:
    target: energy
  convergence:
    generation: 1

runtime:
  schema_version: 2
  potential:
    provider: emt
    parameters: {}
  executor:
    provider: ase
    method: min
    parameters:
      fmax: 0.05
      steps: 100

scheduler:
  provider: local
  parameters: {}
