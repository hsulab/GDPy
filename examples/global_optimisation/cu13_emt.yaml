method: genetic_algorithm
recipe:
  random_seed: 7
  population:
    comparator:
      method: interatomic_distance
    periodic: true
    preserve_fragments: false
    builders:
      random:
        method: random_structure_improved
        composition:
          Cu: 13
        box: [20.0, 20.0, 20.0]
        region:
          method: sphere
          origin: [10.0, 10.0, 10.0]
          radius: 3.0
        covalent_ratio: [0.6, 2.0]
    initial:
      total_size: 4
      builder_allocations:
        - builder: random
          size: 4
    generation:
      total_size: 2
      reproduction:
        size: 2
        mutation_probability: 0.5
      mutation:
        size: 0
      completion:
        builder_proportions:
          - builder: random
            proportion: 1.0
  operators:
    crossover:
      method: cluster_cut_and_splice
    mutation:
      method: rattle
  convergence:
    generation: 1

runtime:
  potential:
    provider: emt
    parameters: {}
  executor:
    provider: ase
    method: min
    parameters:
      fmax: 0.05
      steps: 100
