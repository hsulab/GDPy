method: global_optimisation
random_seed: 53
system:
  periodic: true
  preserve_fragments: false
  retained_size: 4
  comparator:
    method: interatomic_distance
  builders:
    init:
      method: random_structure_improved
      substrates: ../assets/alpha_alumina111_ortho.xyz
      composition:
        Cu: 4
      region:
        method: sphere
        origin:
        - 7.1385
        - 8.2428
        - 10.0
        radius: 1.8
      covalent_ratio:
      - 0.6
      - 2.0
  initial:
    total_size: 4
    builder_allocations:
    - builder: init
      size: 4
  generation:
    total_size: 4
strategy:
  method: simulated_annealing
  convergence:
    generation: 2
  temperatures:
  - - 600
    - 100
  - - 450
    - 100
  selection:
    method: locate
    indices: '-1'
    group_by: axis 0
  simulation:
    provider: ase
    method: md
    parameters:
      setup:
        ensemble:
          method: nvt
        timestep: 0.5
        constraint: '`zbot 60`'
        velocities:
          initialize: if_missing
          remove_rotation: false
        regulator:
          name: langevin
          parameters:
            friction: 0.01
      stop:
        steps: 200
      output:
        trajectory:
          period: 20
