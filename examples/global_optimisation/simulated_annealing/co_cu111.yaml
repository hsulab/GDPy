method: global_optimisation
random_seed: 73
system:
  periodic: true
  preserve_fragments: true
  retained_size: 4
  comparator:
    method: interatomic_distance
  builders:
    init:
      method: random_structure_improved
      substrates: ../assets/cu111_p2x2_3layer_sa.xyz
      composition:
        CO: 1
      region:
        method: lattice
        origin:
        - 0.0
        - 0.0
        - 7.67424245
        cell:
        - - 5.1123820279787395
          - 0.0
          - 0.0
        - - 0.0
          - 4.427452710080594
          - 0.0
        - - 0.0
          - 0.0
          - 2.0
      covalent_ratio:
      - 0.8
      - 2.0
  initial:
    total_size: 4
    builder_allocations:
    - builder: init
      size: 4
  generation:
    total_size: 4
strategy:
  method: simulated_annealing
  objective:
    target: energy
  convergence:
    generation: 3
  temperatures:
  - - 600
    - 100
  - - 450
    - 100
  - - 300
    - 100
  simulation:
    provider: ase
    method: md
    parameters:
      setup:
        ensemble:
          method: nvt
        timestep: 0.5
        constraint: 'zbot 4'
        velocities:
          initialize: if_missing
          remove_rotation: false
        regulator:
          name: langevin
          parameters:
            friction: 0.01
      stop:
        steps: 1000
      output:
        trajectory:
          period: 10
