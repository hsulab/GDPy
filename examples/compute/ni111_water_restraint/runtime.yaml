potential:
  provider: reax
  backend: xreac
  parameters:
    model: bundled:ffield.reax.PtNiCHO.2016
executor:
  provider: ase
  method: md
  parameters:
    ensemble: nvt
    temp: 300.0
    timestep: 0.25
    steps: 20
    dump_period: 5
    velocity_seed: 7
    random_seed: 7
    constraint: lowest 4
    controller:
      name: berendsen
      params:
        Tdamp: 100.0
modifiers:
  - provider: builtin
    method: distance_harmonic
    parameters:
      group: "`index 8 10`"
      kspring: 5.0
    broadcast:
      center: [0.95, 1.15, 1.35, 1.55]
dispatch:
  worker: single
