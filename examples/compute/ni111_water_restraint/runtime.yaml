potential:
  provider: reax
  backend: xreac
  parameters:
    model: bundled:ffield.reax.PtNiCHO.2016
executor:
  provider: ase
  method: md
  parameters:
    random_seed: 7
    setup:
      ensemble: nvt
      timestep: 0.25
      constraint: lowest 4
      velocities:
        initialize: if_missing
        seed: 7
      regulator:
        name: berendsen
        targets:
          temperature: 300.0
        parameters:
          Tdamp: 100.0
    output:
      trajectory:
        period: 5
    stop:
      steps: 20
modifiers:
  - provider: builtin
    method: distance_harmonic
    parameters:
      group: "`index 8 10`"
      kspring: 5.0
    broadcast:
      center: [0.95, 1.15, 1.35, 1.55]
dispatch:
  worker: single
