potential:
  provider: emt
executor:
  provider: native
  method: monte_carlo
  parameters:
    ensemble:
      method: uvt
      temperature: 1200.0
      chemical_potentials:
        Cu: 2.0
    random_seed: 1112
    setup:
      operators:
      - method: exchange
        particles:
        - Cu
        region:
          method: lattice
          origin:
          - 0
          - 0
          - 0
          cell:
          - 8
          - 0
          - 0
          - 0
          - 8
          - 0
          - 0
          - 0
          - 8
        max_random_attempts: 1
    output:
      trajectory:
        period: 1
      checkpoint:
        period: 10
    stop:
      steps: 100
