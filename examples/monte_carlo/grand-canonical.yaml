# gdp compute examples/monte_carlo/assets/aucu8.xyz --runtime examples/monte_carlo/grand-canonical.yaml
potential:
  provider: emt
executor:
  provider: gdpx
  method: monte_carlo
  parameters:
    random_seed: 1112
    setup:
      ensemble:
        method: grand_canonical
        temperature: 1200.0
        chemical_potentials:
          Cu: 2.0
      operators:
      - method: exchange
        particles:
        - Cu
        region:
          method: lattice
          origin:
          - 0
          - 0
          - 0
          cell:
          - 8
          - 0
          - 0
          - 0
          - 8
          - 0
          - 0
          - 0
          - 8
        max_random_attempts: 1
      evaluator:
        executor:
          provider: ase
          method: spc
          parameters: {}
    output:
      trajectory:
        period: 1
      checkpoint:
        period: 10
    stop:
      steps: 100
