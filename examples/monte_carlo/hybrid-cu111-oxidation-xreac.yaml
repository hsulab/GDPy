method: hybrid_monte_carlo
random_seed: 2026

runtime: &single_point
  schema_version: 3
  potential: &reax
    provider: reax
    backend: xreac
    parameters:
      model: bundled:ffield.reax.CuOHCl.2010
  executor:
    provider: ase
    method: spc
    parameters:
      constraint: lowest 4
  options:
    worker: single

system:
  builder:
    method: read_stru
    fname: examples/global_optimisation/assets/cu111_p2x2_3layer.xyz
  ensemble:
    method: grand_canonical
    temperature: 600.0
    chemical_potentials:
      O: -2.0

strategy:
  convergence:
    steps: 1
  ckpt_period: 1
  operators:
    - method: exchange
      particles: [O]
      region:
        method: lattice
        origin: [0.0, 0.0, 6.7]
        cell:
          - [5.11238203, 0.0, 0.0]
          - [0.0, 4.42745271, 0.0]
          - [0.0, 0.0, 4.5]
      max_random_attempts: 1
  cycle:
    - method: molecular_dynamics
      runtime:
        schema_version: 3
        potential: *reax
        executor:
          provider: ase
          method: md
          parameters:
            ensemble: nvt
            temp: 600.0
            timestep: 0.25
            steps: 40
            dump_period: 5
            velocity_seed: 2026
            random_seed: 2026
            remove_rotation: false
            constraint: lowest 4
            controller:
              name: langevin
              params:
                friction: 0.01
    - method: monte_carlo
      steps: 3
      runtime: *single_point
