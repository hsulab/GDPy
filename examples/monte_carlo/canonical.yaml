potential:
  provider: emt
executor:
  provider: native
  method: monte_carlo
  parameters:
    random_seed: 1112
    setup:
      ensemble:
        method: canonical
        temperature: 1200.0
      operators:
      - method: move
        particles:
        - Cu
        max_disp: 0.1
        max_random_attempts: 1
    output:
      trajectory:
        period: 1
      checkpoint:
        period: 10
    stop:
      steps: 100
