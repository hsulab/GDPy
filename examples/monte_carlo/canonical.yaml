method: monte_carlo
recipe:
  random_seed: 1112
  builder:
    method: read_stru
    fname: examples/monte_carlo/assets/cu32.xyz
  operators:
    - method: move
      particles: [Cu]
      max_disp: 0.1
      temperature: 1200.0
      skip_distance_check: true
      max_random_attempts: 1
  convergence:
    steps: 100
  dump_period: 1
  ckpt_period: 10
  should_retry: false
