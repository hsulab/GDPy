method: monte_carlo
random_seed: 1112
system:
  builder:
    method: read_stru
    fname: examples/monte_carlo/assets/cu32.xyz
  ensemble:
    method: canonical
    temperature: 1200.0
strategy:
  convergence:
    steps: 100
  dump_period: 1
  ckpt_period: 10
  operators:
    - method: move
      particles: [Cu]
      max_disp: 0.1
      max_random_attempts: 1
