# gdp compute examples/monte_carlo/assets/cu32.xyz --runtime examples/monte_carlo/canonical.yaml
potential:
  provider: emt
executor:
  provider: gdpx
  method: monte_carlo
  parameters:
    random_seed: 1112
    setup:
      ensemble:
        method: canonical
        temperature: 1200.0
      operators:
      - method: move
        particles:
        - Cu
        max_disp: 0.1
        max_random_attempts: 1
      evaluator:
        executor:
          provider: ase
          method: spc
          parameters: {}
    output:
      trajectory:
        period: 1
      checkpoint:
        period: 10
    stop:
      steps: 100
