potential:
  provider: emt
executor:
  provider: native
  method: monte_carlo
  parameters:
    ensemble:
      method: suvt
      temperature: 1200.0
      chemical_potentials:
        Cu: 0.0
        Ni: 0.0
    random_seed: 1112
    setup:
      operators:
      - method: move
        particles:
        - Cu
        - Ni
        max_disp: 0.1
        max_random_attempts: 1
        probability: 0.5
      - method: swap_type
        particles:
        - Cu
        - Ni
        probability: 0.5
        max_random_attempts: 1
    output:
      trajectory:
        period: 1
      checkpoint:
        period: 10
    stop:
      steps: 100
