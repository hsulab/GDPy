method: monte_carlo
random_seed: 1112
system:
  builder:
    method: read_stru
    fname: examples/monte_carlo/assets/cu16ni16.xyz
  ensemble:
    method: semi_grand_canonical
    temperature: 1200.0
    chemical_potentials:
      Cu: 0.0
      Ni: 0.0
strategy:
  operators:
    - method: move
      particles: [Cu, Ni]
      max_disp: 0.1
      skip_distance_check: true
      max_random_attempts: 1
      probability: 0.5
    - method: swap_type
      particles: [Cu, Ni]
      probability: 0.5
      skip_distance_check: true
      max_random_attempts: 1
convergence:
  steps: 100
output:
  dump_period: 1
checkpoint:
  period: 10
