# gdp compute examples/monte_carlo/assets/cu16ni16.xyz --runtime examples/monte_carlo/semi-grand-canonical.yaml
potential:
  provider: emt
executor:
  provider: gdpx
  method: monte_carlo
  parameters:
    random_seed: 1112
    setup:
      ensemble:
        method: semi_grand_canonical
        temperature: 1200.0
        chemical_potentials:
          Cu: 0.0
          Ni: 0.0
      operators:
      - method: move
        particles:
        - Cu
        - Ni
        max_disp: 0.1
        max_random_attempts: 1
        probability: 0.5
      - method: swap_type
        particles:
        - Cu
        - Ni
        probability: 0.5
        max_random_attempts: 1
      evaluator:
        executor:
          provider: ase
          method: spc
          parameters: {}
    output:
      trajectory:
        period: 1
      checkpoint:
        period: 10
    stop:
      steps: 100
