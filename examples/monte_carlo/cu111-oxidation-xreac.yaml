# gdp compute examples/global_optimisation/assets/cu111_p2x2_3layer.xyz --runtime examples/monte_carlo/cu111-oxidation-xreac.yaml
potential:
  provider: reax
  backend: xreac
  parameters:
    model: bundled:ffield.reax.CuOHCl.2010
executor:
  provider: gdpx
  method: monte_carlo
  parameters:
    random_seed: 2033
    setup:
      ensemble:
        method: grand_canonical
        temperature: 600.0
        chemical_potentials:
          O: -2.0
      operators:
      - method: exchange
        particles:
        - O
        region:
          method: lattice
          origin:
          - 0.0
          - 0.0
          - 6.7
          cell:
          - - 5.11238203
            - 0.0
            - 0.0
          - - 0.0
            - 4.42745271
            - 0.0
          - - 0.0
            - 0.0
            - 4.5
        max_random_attempts: 1
      evaluator:
        executor:
          provider: ase
          method: spc
          parameters:
            setup:
              constraint: '`zbot 4`'
    output:
      trajectory:
        period: 1
      checkpoint:
        period: 3
    stop:
      steps: 3
