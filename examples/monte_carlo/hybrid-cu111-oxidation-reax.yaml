method: hybrid_monte_carlo
random_seed: 2026

# The bundled Cu/O/H/Cl force field is loaded by xreac.
runtime: &single_point
  schema_version: 3
  potential: &reax
    provider: reax
    backend: xreac
    parameters:
      model: bundled:ffield.reax.CuOHCl.2010
  executor:
    provider: ase
    method: spc
    parameters: {}
  options:
    worker: single

system:
  builder:
    method: read_stru
    fname: examples/global_optimisation/assets/cu111_p2x2_2layer.xyz
  ensemble:
    method: grand_canonical
    temperature: 600.0
    # Illustrative atomic-O reservoir value in eV; calibrate for the chosen ReaxFF model.
    chemical_potentials:
      O: -4.95

strategy:
  steps: 10
  ckpt_period: 1
  operators:
    - method: exchange
      particles: [O]
      region:
        method: lattice
        origin: [0.0, 0.0, 4.6]
        cell:
          - [5.11238203, 0.0, 0.0]
          - [0.0, 4.42745271, 0.0]
          - [0.0, 0.0, 4.5]
      covalent_ratio: [0.6, 2.0]
      max_random_attempts: 100
  cycle:
    - method: molecular_dynamics
      runtime:
        schema_version: 3
        potential: *reax
        executor:
          provider: ase
          method: md
          parameters:
            ensemble: nvt
            temp: 600.0
            timestep: 0.25
            steps: 100
            dump_period: 10
            random_seed: 2026
            remove_rotation: false
            controller:
              name: langevin
              params:
                friction: 0.01
    - method: monte_carlo
      steps: 5
      runtime: *single_point
