method: hybrid_monte_carlo
random_seed: 1112
# Initial evaluation and MC trials use the same EMT single-point runtime.
runtime: &single_point
  schema_version: 3
  potential:
    provider: emt
  executor:
    provider: ase
    method: spc
    parameters: {}
  options:
    worker: single
system:
  builder:
    method: read_stru
    fname: examples/monte_carlo/assets/cu16ni16.xyz
  ensemble:
    method: semi_grand_canonical
    temperature: 1200.0
    chemical_potentials:
      Cu: 0.0
      Ni: 0.0
strategy:
  convergence:
    steps: 5
  ckpt_period: 1
  operators:
    - method: swap_type
      particles: [Cu, Ni]
      max_random_attempts: 1
  cycle:
    - method: molecular_dynamics
      runtime:
        schema_version: 3
        potential:
          provider: emt
        executor:
          provider: ase
          method: md
          parameters:
            ensemble: nvt
            temp: 1200.0
            timestep: 1.0
            steps: 20
            dump_period: 5
            velocity_seed: 7
            random_seed: 7
            remove_rotation: false
            controller:
              name: langevin
              params:
                friction: 0.01
    - method: monte_carlo
      steps: 5
      runtime: *single_point
