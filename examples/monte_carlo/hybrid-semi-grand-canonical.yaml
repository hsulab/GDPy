method: hybrid_monte_carlo
random_seed: 1112
# Initial evaluation and MC trials use the same EMT single-point runtime.
runtime: &single_point
  potential:
    provider: emt
  executor:
    provider: ase
    method: spc
    parameters: {}
  dispatch:
    worker: single
system:
  builder:
    method: read_stru
    fname: examples/monte_carlo/assets/cu16ni16.xyz
  ensemble:
    method: semi_grand_canonical
    temperature: 1200.0
    chemical_potentials:
      Cu: 0.0
      Ni: 0.0
strategy:
  convergence:
    steps: 5
  ckpt_period: 1
  operators:
    - method: swap_type
      particles: [Cu, Ni]
      max_random_attempts: 1
  cycle:
    - method: molecular_dynamics
      runtime:
        potential:
          provider: emt
        executor:
          provider: ase
          method: md
          parameters:
            random_seed: 7
            setup:
              ensemble: nvt
              timestep: 1.0
              velocities:
                seed: 7
                remove_rotation: false
              regulator:
                name: langevin
                targets:
                  temperature: 1200.0
                parameters:
                  friction: 0.01
            output:
              trajectory:
                period: 5
            stop:
              steps: 20
    - method: monte_carlo
      steps: 5
      runtime: *single_point
