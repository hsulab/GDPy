potential:
  provider: nnp
  parameters:
    model_file: ./nnp_train/nn_weights.npz
    type_map: ["Cu", "Au"]

executor:
  provider: ase
  method: md
  parameters:
    ensemble:
      method: nvt
      temperature: 300.0
    setup:
      timestep: 1.0
      regulator:
        name: langevin
    output:
      trajectory:
        period: 100
    stop:
      steps: 10000
scheduler:
  provider: direct
  parameters: {}
  transport:
    provider: local
    parameters: {}
dispatch:
  batch_size: 1
